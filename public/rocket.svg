<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4c1d95"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="50%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
  </defs>
  
  <!-- Rocket body -->
  <ellipse cx="50" cy="40" rx="20" ry="35" fill="url(#bodyGrad)" stroke="#fbbf24" stroke-width="2"/>
  
  <!-- Window -->
  <circle cx="50" cy="35" r="10" fill="#3b82f6" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="50" cy="35" r="6" fill="#60a5fa"/>
  
  <!-- Fins -->
  <path d="M30 60 L20 80 L35 70 Z" fill="url(#bodyGrad)" stroke="#fbbf24" stroke-width="1"/>
  <path d="M70 60 L80 80 L65 70 Z" fill="url(#bodyGrad)" stroke="#fbbf24" stroke-width="1"/>
  
  <!-- Flame -->
  <ellipse cx="50" cy="85" rx="12" ry="12" fill="url(#flameGrad)"/>
  <ellipse cx="50" cy="80" rx="8" ry="8" fill="#fbbf24"/>
  
  <!-- Stars -->
  <circle cx="15" cy="20" r="2" fill="#fbbf24"/>
  <circle cx="85" cy="15" r="1.5" fill="#fbbf24"/>
  <circle cx="10" cy="50" r="1" fill="#fbbf24"/>
  <circle cx="90" cy="45" r="1.5" fill="#fbbf24"/>
</svg>
